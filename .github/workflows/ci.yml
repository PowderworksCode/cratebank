name: ci

# This workflow is deliberately credential-free. Privileged previews and real
# remote-state plans live in preview.yml, whose approval gate is loaded from
# the default branch rather than from pull-request code.

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
        working-directory: cargo-cratebank
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: cargo-cratebank
      - run: cargo test
        working-directory: cargo-cratebank

  # Keep the client portable across its supported operating systems.
  cross:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets
        working-directory: cargo-cratebank

  # End to end on stable: samply and Cargo timings are parsed into one payload,
  # compressed, posted, decoded, and summarized by the reference collector.
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: allow perf events
        run: |
          sudo sysctl kernel.perf_event_paranoid=1
          sudo sysctl kernel.perf_event_mlock_kb=2048 || true
      - run: cargo install samply --locked
      - run: cargo build --release
        working-directory: cargo-cratebank
      - name: post a session to the reference collector
        run: |
          set -o pipefail
          BIN=cargo-cratebank/target/release/cargo-cratebank
          "$BIN" cratebank serve --port 8787 2> /tmp/cratebank-collector.log &
          sleep 2
          CARGO_TARGET_DIR=/tmp/cratebank-roundtrip-target \
            "$BIN" --endpoint http://127.0.0.1:8787/ingest build \
            --manifest-path cargo-cratebank/Cargo.toml | tee /tmp/cratebank-send.log
          grep -Eq 'sent .*: [1-9][0-9]* timing units .* [1-9][0-9]* sampled units' \
            /tmp/cratebank-send.log
          grep -Eq '\[ingest\] zstd run .* [1-9][0-9]* timing units .* [1-9][0-9]* sampled units' \
            /tmp/cratebank-collector.log

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
        working-directory: infra
      - run: tofu init -backend=false
        working-directory: infra
      # Catches resource and top-level argument names. The remote plan validates
      # provider-specific nested configuration against the real account.
      - run: tofu validate
        working-directory: infra
      # Check the ingest Worker source parses.
      - run: node --check worker/ingest.js
        working-directory: infra

  # The compactor bundle is committed so `tofu plan` has everything it reads.
  # The site is rendered into an ignored static-assets directory and checked
  # as build output rather than committed.
  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: infra/worker
      - run: npm test
        working-directory: infra/worker
      - run: npm run build
        working-directory: infra/worker
      - name: build outputs are valid
        run: |
          git diff --exit-code -- dist/compact.js
          test -s dist/site/index.html
          grep -q '<h1>cratebank</h1>' dist/site/index.html
        working-directory: infra/worker

  straitjacket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PowderworksCode/straitjacket@main
