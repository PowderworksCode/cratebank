name: ci

# Nothing here touches Cloudflare. The ingest Worker can be exercised locally
# with `wrangler dev --local`, which gives a simulated R2 binding, so the whole
# put-a-blob path is testable offline -- but that is a developer step, not a CI
# one, and the properties that depend on a real account (DNS, custom domain,
# plan limits) are checked by deploying.

on:
  push: { branches: [main] }
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - run: cargo fmt --check
        working-directory: cargo-cratebank
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: cargo-cratebank
      - run: cargo test
        working-directory: cargo-cratebank

  # The client broke on Windows once already: libc::wait4 is unix-only, and
  # nothing caught it until someone tried. Cheap to keep honest.
  cross:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets
        working-directory: cargo-cratebank

  # End to end without Cloudflare: the client posts a real payload to the
  # reference collector, brotli and all.
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        working-directory: cargo-cratebank
      - name: post a session to the reference collector
        run: |
          BIN=cargo-cratebank/target/release/cargo-cratebank
          "$BIN" cratebank serve --port 8787 & sleep 2
          cargo new --lib /tmp/probe && cd /tmp/probe
          "$OLDPWD/$BIN" cratebank status
          cd "$OLDPWD"
          test -x "$BIN"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      # Catches resource and top-level argument names. It does NOT catch wrong
      # nesting inside config blocks -- it once passed a key named bogus_key --
      # so `plan` against a real account remains the only real check.
      - run: terraform validate
        working-directory: infra
      # The Worker is the ingest path now; check it parses.
      - run: node --check worker/ingest.js
        working-directory: infra

  # worker/dist/compact.js is committed so `tofu apply` works without a node
  # toolchain. That only stays honest if the bundle matches its source, so
  # rebuild it and fail on any drift -- otherwise a fix to compact.js could sit
  # in the repo for weeks while the deployed Worker runs the old bytes.
  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: infra/worker
      - run: npm run build
        working-directory: infra/worker
      - name: bundle is up to date with its source
        run: git diff --exit-code -- dist/compact.js
        working-directory: infra/worker

  # Sampling is how phases are measured, so prove it works on a runner rather
  # than only on a laptop. Linux only, deliberately: on macOS samply injects a
  # preload dylib into every child, and hosted arm64e runners reject it --
  # every build script dies with SIGABRT. That is why the client treats a
  # failed sampler as a loud warning and re-runs the build plainly.
  sampling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: allow perf events
        run: |
          sudo sysctl kernel.perf_event_paranoid=1
          sudo sysctl kernel.perf_event_mlock_kb=2048 || true
      - run: cargo install samply --locked
      - name: sample a real build
        working-directory: cargo-cratebank
        run: |
          samply record --save-only --unstable-presymbolicate --include-args \
            -o /tmp/p.json --rate 999 -- cargo build
      - name: the profile must attribute samples to units
        run: |
          python3 - <<'EOF'
          import json, re
          d = json.load(open('/tmp/p.json'))
          n = sum(len(t['samples'].get('time') or []) for t in d['threads'])
          units = [t for t in d['threads'] if '--crate-name' in (t.get('processName') or '')]
          sy = json.load(open('/tmp/p.syms.json'))
          crates = {m.group(1) for s in sy['string_table']
                    for m in [re.match(r'^(rustc_[a-z_]+)::', str(s))] if m}
          print(f"samples={n} unit-threads={len(units)} rustc-crates={len(crates)}")
          assert n > 0, "no samples"
          assert units, "--include-args exposed no rustc command lines"
          assert crates, "no rustc symbols resolved"
          EOF

  straitjacket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PowderworksCode/straitjacket@main
