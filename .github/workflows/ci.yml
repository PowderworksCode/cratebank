name: ci

# Nothing here touches Cloudflare. The ingest Worker can be exercised locally
# with `wrangler dev --local`, which gives a simulated R2 binding, so the whole
# put-a-blob path is testable offline -- but that is a developer step, not a CI
# one, and the properties that depend on a real account (DNS, custom domain,
# plan limits) are checked by deploying.

on:
  push: { branches: [main] }
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - run: cargo fmt --check
        working-directory: cargo-cratebank
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: cargo-cratebank
      - run: cargo test
        working-directory: cargo-cratebank

  # The client broke on Windows once already: libc::wait4 is unix-only, and
  # nothing caught it until someone tried. Cheap to keep honest.
  cross:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets
        working-directory: cargo-cratebank

  # End to end without Cloudflare: the client posts a real payload to the
  # reference collector, brotli and all.
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        working-directory: cargo-cratebank
      - name: post a session to the reference collector
        run: |
          BIN=cargo-cratebank/target/release/cargo-cratebank
          "$BIN" cratebank serve --port 8787 & sleep 2
          cargo new --lib /tmp/probe && cd /tmp/probe
          "$OLDPWD/$BIN" cratebank status
          cd "$OLDPWD"
          test -x "$BIN"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      # Catches resource and top-level argument names. It does NOT catch wrong
      # nesting inside config blocks -- it once passed a key named bogus_key --
      # so `plan` against a real account remains the only real check.
      - run: terraform validate
        working-directory: infra
      # The Worker is the ingest path now; check it parses.
      - run: node --check worker/ingest.js
        working-directory: infra

  # worker/dist/compact.js is committed so `tofu apply` works without a node
  # toolchain. That only stays honest if the bundle matches its source, so
  # rebuild it and fail on any drift -- otherwise a fix to compact.js could sit
  # in the repo for weeks while the deployed Worker runs the old bytes.
  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: infra/worker
      - run: npm run build
        working-directory: infra/worker
      - name: bundle is up to date with its source
        run: git diff --exit-code -- dist/compact.js
        working-directory: infra/worker

  straitjacket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PowderworksCode/straitjacket@main
