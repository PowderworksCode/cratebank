[package]
name = "cargo-cratebank"
version = "0.1.0"
edition = "2021"
description = "Share the Rust build timings you were already producing (opt-in)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cargo-cratebank"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# zstd: brotli-class ratios, and DuckDB decompresses it natively -- so a raw
# uploaded blob is directly queryable from R2 with no conversion step. brotli
# is NOT readable by DuckDB (verified), which is why it lost.
#
# This is a C dependency (zstd-sys, built via `cc`), which is only acceptable
# because `ring` -- pulled in by ureq -> rustls for TLS -- already requires a C
# toolchain to build this crate at all. If the TLS provider is ever swapped for
# a pure-Rust one, this becomes the blocker: there is no pure-Rust zstd
# *encoder* (ruzstd decodes only). Make that a deliberate choice, not a
# surprise.
zstd = "0.13"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
