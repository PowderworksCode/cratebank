[package]
name = "cargo-cratebank"
version = "0.1.0"
edition = "2021"
description = "Share the Rust build timings you were already producing (opt-in)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cargo-cratebank"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
